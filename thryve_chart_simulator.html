<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thryve — Health Metric Chart Simulator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F5F5F0; color: #1A1A2E; min-height: 100vh; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; color: #1A1A2E; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #888780; margin-bottom: 20px; }

  .top { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; font-weight: 500; color: #888780; text-transform: uppercase; letter-spacing: .05em; }
  select, input[type=number] { height: 36px; padding: 0 10px; border: 1px solid #D3D1C7; border-radius: 8px; font-size: 13px; background: #fff; color: #1A1A2E; outline: none; }
  select:focus, input:focus { border-color: #1D9E75; }
  select { min-width: 200px; }
  input[type=number] { width: 100px; }

  .card { background: #fff; border-radius: 16px; padding: 24px; border: 1px solid #E8E6DF; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
  .kpi { background: #F5F5F0; border-radius: 10px; padding: 12px 14px; }
  .kpi-l { font-size: 11px; color: #888780; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi-v { font-size: 20px; font-weight: 600; color: #1A1A2E; }
  .kpi-s { font-size: 11px; color: #B4B2A9; margin-top: 2px; }

  /* CHART */
  .chart-wrap { position: relative; height: 280px; display: flex; gap: 0; }
  .y-axis { width: 56px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; padding-right: 10px; padding-bottom: 28px; flex-shrink: 0; }
  .y-tick { font-size: 11px; color: #B4B2A9; white-space: nowrap; }
  .chart-body { flex: 1; position: relative; border-left: 1px solid #E8E6DF; border-bottom: 1px solid #E8E6DF; }
  .gridlines { position: absolute; inset: 0 0 0 0; pointer-events: none; }
  .gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed #F0EEE8; }
  .bars-row { position: absolute; left: 0; right: 0; top: 0; bottom: 28px; display: flex; align-items: flex-end; padding: 0 12px; gap: 6px; }
  .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 4px; position: relative; transition: opacity .15s; cursor: pointer; }
  .bar:hover { opacity: .8; }
  .bar-val { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; white-space: nowrap; }
  .x-labels { position: absolute; bottom: 0; left: 0; right: 0; height: 24px; display: flex; padding: 0 12px; gap: 6px; }
  .x-label { flex: 1; text-align: center; font-size: 10px; color: #B4B2A9; line-height: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .goal-line { position: absolute; left: 0; right: 0; border-top: 2px dashed #1D9E75; pointer-events: none; }
  .goal-tag { position: absolute; right: 6px; font-size: 10px; font-weight: 600; color: #1D9E75; transform: translateY(-14px); background: #fff; padding: 1px 4px; border-radius: 4px; }

  .zone-bar { height: 6px; border-radius: 99px; display: flex; overflow: hidden; margin-bottom: 16px; }
  .zone-seg { transition: flex .3s; }
  .zones-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .zone-pill { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5F5E5A; }
  .zone-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .algo-box { background: #F5F5F0; border-radius: 10px; padding: 14px 16px; font-size: 12px; color: #5F5E5A; line-height: 1.7; }
  .algo-box code { font-family: "SF Mono", "Fira Code", monospace; font-size: 11px; background: #E8E6DF; padding: 1px 5px; border-radius: 4px; color: #1A1A2E; }

  .ticks-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tick-chip { background: #fff; border: 1px solid #E8E6DF; border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 600; font-family: "SF Mono", monospace; }
  .tick-chip.top { background: #E1F5EE; border-color: #1D9E75; color: #0F6E56; }

  .section-title { font-size: 11px; font-weight: 600; color: #888780; text-transform: uppercase; letter-spacing: .06em; margin: 20px 0 10px; }

  @media (max-width: 640px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .top { flex-direction: column; align-items: stretch; }
    select { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>

<h1>Thryve — Health Metric Chart Simulator</h1>
<p class="sub">All 33 trackers. Y-axis computed dynamically — always 3–5 clean ticks from 0.</p>

<div class="top">

    <label>Metric</label>

  </div>
</div>

<div class="card">
  <div class="kpis" id="kpis"></div>
  <div class="section-title">Chart</div>
  <div class="chart-wrap">
    <div class="y-axis" id="y-axis"></div>
    <div class="chart-body" id="chart-body">

  <div class="zone-bar" id="zone-bar"></div>
  <div class="zones-legend" id="zones-legend"></div>
  <div class="section-title">Y-axis calculation</div>
  <div class="algo-box" id="algo-box"></div>
  <div class="ticks-row" id="ticks-row"></div>

function fmtN(n){
  n=+n;
  if(isNaN(n))return "—";
  if(n>=1000000)return (n/1000000).toFixed(1).replace(/\.0$/,"")+"M";
  if(n>=1000&&n%1000===0)return (n/1000)+"k";
  if(n>=10000)return n.toLocaleString();
  if(n===Math.round(n))return String(Math.round(n));
  return +n.toFixed(2)+"";
}

function computeYAxis(peak, y0, rangeHint, integerOnly){
  if(peak<=y0) peak=y0+1;
  const magBase = rangeHint != null ? Math.max(rangeHint, 0.1) : Math.max(peak, 1);
  const mag=Math.pow(10,Math.floor(Math.log10(magBase)));
  for(const m of NICE){
    const interval=+(m*mag).toFixed(10);
    if(interval<=0)continue;
    if(integerOnly && Math.round(interval)!==interval) continue;
    // For dynamic (rangeHint set): start ticks from snapped y0
    // For standard (no rangeHint): start ticks from 0, ceiling = next multiple above peak
    const tickStart = rangeHint!=null ? Math.floor(y0/interval)*interval : 0;
    const ceil = Math.ceil(peak/interval)*interval;
    const all=[];
    for(let t=tickStart;t<=ceil+interval*0.0001;t=+(t+interval).toFixed(10))all.push(+t.toFixed(10));
    const vis=all.filter(t=>t>=y0-1e-9);
    if(vis.length>=3&&vis.length<=5)return{interval,ceil,all,vis,mag,mult:m};
  }
  const interval=Math.ceil(peak/4);
  const ceil=interval*4;
  const all=[];for(let t=0;t<=ceil+0.001;t+=interval)all.push(+t.toFixed(10));
  const vis=all.filter(t=>t>=y0-1e-9);
  return{interval,ceil,all,vis,mag,mult:"fallback"};
}

  "Pain":{unit:"score",y0:0,yMax:10,goal:3,goalLabel:"Mild ≤3",goalInvert:true,

  "Water Intake":{unit:"mL",y0:0,yMax:3000,goal:2500,goalLabel:"2,500 mL goal",

      Y:{labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],data:[2000,2000,2200,2300,2500,2800,3000,2900,2500,2200,2000,1900],agg:"Daily avg per month"},

  "Medication Adherence":{unit:"%",y0:0,yMax:100,goal:90,goalLabel:"≥90%",

  "Smoking":{unit:"cig/day",y0:0,yMax:20,goal:0,goalLabel:"0 cig target",goalInvert:true,
    zones:[{max:0,l:"Non-smoker"},{max:5,l:"Light"},{max:10,l:"Moderate"},{max:20,l:"Heavy"}],
    tf:{

      Y:{labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],data:[12,11,10,9,9,8,8,7,7,6,6,5],agg:"Daily avg per month"},
    }},
  "Alcohol":{unit:"drinks/day",y0:0,yMax:14,goal:2,goalLabel:"≤2 drinks",goalInvert:true,
    zones:[{max:0,l:"None"},{max:2,l:"Low risk"},{max:4,l:"Moderate"},{max:6,l:"High risk"},{max:14,l:"Very High"}],
    tf:{

function getZoneIdx(v, zones){
  for(let i=0;i<zones.length;i++) if(v<=zones[i].max) return i;
  return zones.length-1;
}
function getZoneColor(v, zones){ return ZONE_COLORS[Math.min(getZoneIdx(v,zones),ZONE_COLORS.length-1)]; }
function getZoneBg(v, zones){ return ZONE_BG[Math.min(getZoneIdx(v,zones),ZONE_BG.length-1)]; }

// populate selects
const selM = document.getElementById("sel-metric");
Object.keys(METRICS).forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=k; selM.appendChild(o); });

const selTf = document.getElementById("sel-tf");

function updateTfOptions(){
  const mk = selM.value;
  const tfs = Object.keys(METRICS[mk].tf);
  selTf.innerHTML="";
  tfs.forEach(tf=>{ const o=document.createElement("option"); o.value=tf; o.textContent={D:"Daily",W:"Weekly",M:"Monthly",Y:"Yearly"}[tf]||tf; selTf.appendChild(o); });
  selTf.value = tfs.includes("W") ? "W" : tfs[0];
}

selM.addEventListener("change", ()=>{ updateTfOptions(); render(); });

function render(){
  const mk  = selM.value;
  const tf  = selTf.value;
  const m   = METRICS[mk];
  const tfd = m.tf[tf];
  if(!tfd) return;

  const rawData = tfd.data.map(Number);
  const peakOverride = parseFloat(document.getElementById("inp-peak").value);
  const dataPeak = Math.max(...rawData);
  const peak = (!isNaN(peakOverride) && peakOverride > 0) ? Math.min(peakOverride, m.yMax) : Math.min(dataPeak, m.yMax);

  // Scale data first, THEN compute dynamic bounds from scaled values
  const scaledForBounds = rawData.map(v => {
    if(m.dynamicBounds){
      // Shift mode: preserve relative differences, shift so max(data) = peak
      const shift = dataPeak - peak;
      return v - shift;
    }
    return dataPeak > 0 ? v * (peak / dataPeak) : v;
  });

  let effectiveY0 = m.y0;
  let effectiveYMax = m.yMax;
  if(m.dynamicBounds){
    // Compute bounds from SCALED data
    const sMin      = Math.min(...scaledForBounds);
    const sMax      = Math.max(...scaledForBounds);  // = peak
    const sRange    = sMax - sMin;
    const noiseFloor  = sMax * 0.015;
    const buffer      = Math.round(Math.max(sRange * 0.5, noiseFloor, 1) * 10) / 10;
    const bufferAbove = Math.round(buffer * 0.5 * 10) / 10;
    effectiveY0       = sMin - buffer;
    effectiveYMax     = sMax + bufferAbove;
  }

  // First pass to get interval, then snap y0/yMax to interval multiples
  const rangeHint0 = m.dynamicBounds ? (effectiveYMax - effectiveY0) : null;
  const firstPass  = computeYAxis(peak, effectiveY0, rangeHint0, m.integerOnly);
  const interval0  = firstPass.interval;
  if(m.dynamicBounds){
    effectiveY0   = Math.floor(effectiveY0  / interval0) * interval0;
    effectiveYMax = Math.ceil(effectiveYMax / interval0) * interval0;
  }

  const rangeHint = m.dynamicBounds ? (effectiveYMax - effectiveY0) : null;
  const {interval, ceil, all, vis} = computeYAxis(
    m.dynamicBounds ? effectiveYMax : peak,
    effectiveY0,
    rangeHint,
    m.integerOnly
  );
  const visRange = ceil - effectiveY0;

  // KPIs
  const avg = rawData.reduce((a,b)=>a+b,0)/rawData.length;
  const zi  = getZoneIdx(peak, m.zones);
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="kpi-l">Peak</div><div class="kpi-v">${fmtN(peak)}</div><div class="kpi-s">${m.unit}</div></div>
    <div class="kpi"><div class="kpi-l">Ceiling</div><div class="kpi-v">${fmtN(ceil)}</div><div class="kpi-s">snapped from ${fmtN(interval)} interval</div></div>
    <div class="kpi"><div class="kpi-l">Ticks shown</div><div class="kpi-v">${vis.length}</div><div class="kpi-s">of ${vis.length} ticks · from ${fmtN(effectiveY0)}</div></div>
    <div class="kpi"><div class="kpi-l">Zone (peak)</div><div class="kpi-v" style="font-size:14px;color:${ZONE_COLORS[Math.min(zi,ZONE_COLORS.length-1)]}">${m.zones[zi].l}</div><div class="kpi-s">${tfd.agg}</div></div>
  `;

  // Y axis
  const yAxisEl = document.getElementById("y-axis");
  yAxisEl.innerHTML = vis.slice().reverse().map(t=>`<span class="y-tick">${fmtN(t)}</span>`).join("");

  // Gridlines
  const glEl = document.getElementById("gridlines");
  glEl.innerHTML = vis.map(t=>{
    const pct = visRange>0 ? (1-(t-effectiveY0)/visRange)*100 : 0;
    return `<div class="gridline" style="top:${pct.toFixed(2)}%"></div>`;
  }).join("");

  // Bars
  const barsEl = document.getElementById("bars-row");
  // Scale data proportionally to peak
  // Use already-computed scaled data
  const scaledData = scaledForBounds;
  barsEl.innerHTML = scaledData.map((v,i)=>{
    const frac      = visRange>0 ? Math.max(0,(v - effectiveY0)/visRange) : 0;
    const heightPct = Math.max(frac*100, v > effectiveY0 ? 1.5 : 0);
    const color     = getZoneColor(v, m.zones);
    const bg        = getZoneBg(v, m.zones);
    const valLabel  = frac>0.08
      ? `<span class="bar-val" style="color:${color}">${m.dynamicBounds && !m.integerOnly ? v.toFixed(1) : fmtN(Math.round(v))}</span>` : "";
    return `<div class="bar-wrap">
      <div class="bar" style="height:${heightPct.toFixed(2)}%;background:${bg};border:2px solid ${color};"
        title="${tfd.labels[i]}: ${m.dynamicBounds && !m.integerOnly ? v.toFixed(1) : fmtN(Math.round(v))} ${m.unit}">
        ${valLabel}
      </div>
    </div>`;
  }).join("");

  // X labels
  document.getElementById("x-labels").innerHTML = tfd.labels.map(l=>`<span class="x-label">${l}</span>`).join("");

  // Goal line
  const glLine = document.getElementById("goal-line");
  if(m.goal!=null && visRange>0){
    const gf = (m.goal - effectiveY0)/visRange;
    if(gf>=0 && gf<=1.05){
      glLine.style.display="block";
      glLine.style.bottom=(Math.min(gf,1)*100).toFixed(2)+"%";
      glLine.style.top="auto";
      document.getElementById("goal-tag").textContent = m.goalLabel || fmtN(m.goal);
    } else { glLine.style.display="none"; }
  } else { glLine.style.display="none"; }

  // Zone bar
  const totalRange = effectiveYMax - effectiveY0;
  document.getElementById("zone-bar").innerHTML = m.zones.map((z,i)=>{
    const prev = i>0 ? m.zones[i-1].max : effectiveY0;
    const width = ((Math.min(z.max,effectiveYMax)-Math.max(prev,effectiveY0))/totalRange*100).toFixed(2);
    return `<div class="zone-seg" style="flex:${width};background:${ZONE_BG[Math.min(i,ZONE_BG.length-1)]};border-right:1px solid #fff"></div>`;
  }).join("");

  document.getElementById("zones-legend").innerHTML = m.zones.map((z,i)=>`
    <div class="zone-pill">
      <div class="zone-dot" style="background:${ZONE_COLORS[Math.min(i,ZONE_COLORS.length-1)]}"></div>
      ${z.l} (≤${fmtN(z.max)})
    </div>`).join("");

  // Algo box
  document.getElementById("algo-box").innerHTML =
    `Peak <code>${fmtN(peak)}</code> → magnitude <code>${fmtN(Math.pow(10,Math.floor(Math.log10(Math.max(peak,1)))))}</code> → interval <code>${fmtN(interval)}</code> → ceiling <code>${fmtN(ceil)}</code><br/>
     All ticks from 0: ${all.map(t=>`<code>${fmtN(t)}</code>`).join(" ")} — showing ticks ≥ <code>${fmtN(effectiveY0)}</code>`;

  document.getElementById("ticks-row").innerHTML = vis.map((t,i)=>
    `<span class="tick-chip${i===vis.length-1?" top":""}">${fmtN(t)}</span>`
  ).join("");
}

updateTfOptions();
render();
</script>
